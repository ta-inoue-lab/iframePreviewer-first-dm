<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iframe Previewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    /* ---- 最小限のカスタムスタイル ---- */
    html, body { height: 100%; background: #f8f9fa; }

    /* コントロールパネル */
    #control-panel { background: #fff; border-bottom: 1px solid #dee2e6; }

    /* iframeラッパー：overflow-xでスクロール可能にし、横幅を中央揃え */
    #preview-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      display: flex;
      justify-content: flex-start;
      flex: 1 1 0;
      min-height: 0;
    }

    #preview-container {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem;
      flex-shrink: 0;
    }

    .preview-slot {
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      min-width: 0;
    }

    .preview-slot .slot-label {
      font-size: .75rem;
      color: #6c757d;
      margin-bottom: .25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview-slot iframe {
      border: 1px solid #dee2e6;
      display: block;
      background: #fff;
    }

    /* iframeが空のときのプレースホルダー */
    .preview-slot .iframe-placeholder {
      border: 1px dashed #ced4da;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #adb5bd;
      background: #f8f9fa;
      font-size: .875rem;
    }

    /* リサイズハンドル */
    #resize-handle {
      cursor: col-resize;
      width: 8px;
      background: #dee2e6;
      border-radius: 4px;
      flex-shrink: 0;
      align-self: stretch;
      transition: background .15s;
    }
    #resize-handle:hover, #resize-handle.dragging { background: #0d6efd; }

    /* 高さリサイズハンドル */
    #resize-handle-h {
      cursor: row-resize;
      height: 8px;
      background: #dee2e6;
      border-radius: 4px;
      margin: 0 1rem;
      transition: background .15s;
    }
    #resize-handle-h:hover, #resize-handle-h.dragging { background: #0d6efd; }

    /* レイアウト */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #main-area {
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
      min-height: 0;
      overflow: hidden;
    }

    /* トースト */
    .toast-container { z-index: 1100; }

    /* ハンバーガー展開時のオフキャンバス内 */
    .offcanvas .form-label { font-size: .85rem; }
  </style>
</head>
<body>
<div id="app">

  <!-- ===== ナビバー ===== -->
  <nav class="navbar navbar-light py-1 px-3" id="control-panel">
    <div class="d-flex align-items-center gap-2 flex-wrap w-100">

      <!-- ブランド -->
      <span class="navbar-brand mb-0 fw-bold fs-6 me-2">
        <i class="bi bi-layout-split text-primary"></i> iframe Previewer
      </span>

      <!-- デスクトップ：コントロール群 -->
      <div class="d-none d-md-flex align-items-center gap-2 flex-wrap flex-grow-1" id="desktop-controls">

        <!-- URL inputs (6個) -->
        <div class="d-flex flex-wrap gap-1 flex-grow-1">
          <template v-for="(url, i) in urls" :key="i">
            <div class="input-group input-group-sm" style="min-width:160px; max-width:220px; flex:1 1 160px;">
              <span class="input-group-text px-1 text-secondary" style="font-size:.7rem;">{{ i+1 }}</span>
              <input
                type="url"
                class="form-control form-control-sm"
                :placeholder="'URL ' + (i+1)"
                v-model="urls[i]"
                @keydown.enter="applyUrls"
              />
              <button class="btn btn-outline-secondary btn-sm px-1" @click="clearUrl(i)" title="クリア">
                <i class="bi bi-x"></i>
              </button>
            </div>
          </template>
        </div>

        <!-- 適用ボタン -->
        <button class="btn btn-primary btn-sm" @click="applyUrls">
          <i class="bi bi-play-fill"></i> 表示
        </button>

        <!-- サイズコントロール -->
        <div class="d-flex align-items-center gap-1">
          <input type="number" class="form-control form-control-sm" style="width:70px;"
                 v-model.number="frameWidth" min="200" max="3000" title="幅(px)" />
          <span class="text-secondary small">×</span>
          <input type="number" class="form-control form-control-sm" style="width:70px;"
                 v-model.number="frameHeight" min="200" max="3000" title="高さ(px)" />
          <span class="text-secondary small">px</span>
        </div>

        <!-- プリセットボタン -->
        <div class="btn-group btn-group-sm">
          <button v-for="p in presets" :key="p.label"
                  class="btn btn-outline-secondary"
                  :class="{ active: activePreset === p.label }"
                  @click="applyPreset(p)"
                  :title="p.label + ' ' + p.w + 'px'">
            <i :class="p.icon"></i>
            <span class="d-none d-lg-inline ms-1">{{ p.label }}</span>
          </button>
        </div>

        <!-- シェアボタン -->
        <button class="btn btn-outline-info btn-sm" @click="copyShareUrl" title="URLをコピー">
          <i class="bi bi-share"></i>
        </button>

      </div>

      <!-- モバイル：ハンバーガー -->
      <div class="d-flex d-md-none ms-auto gap-2">
        <button class="btn btn-primary btn-sm" @click="applyUrls">
          <i class="bi bi-play-fill"></i>
        </button>
        <button class="btn btn-outline-info btn-sm" @click="copyShareUrl">
          <i class="bi bi-share"></i>
        </button>
        <button class="btn btn-outline-secondary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#mobileMenu">
          <i class="bi bi-list fs-5"></i>
        </button>
      </div>

    </div>
  </nav>

  <!-- ===== モバイル用オフキャンバス ===== -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">
    <div class="offcanvas-header border-bottom">
      <h6 class="offcanvas-title">設定</h6>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">

      <p class="form-label fw-semibold mb-1">URL（最大6つ）</p>
      <div class="d-flex flex-column gap-2 mb-3">
        <template v-for="(url, i) in urls" :key="'m'+i">
          <div class="input-group input-group-sm">
            <span class="input-group-text px-1 text-secondary" style="font-size:.7rem;">{{ i+1 }}</span>
            <input type="url" class="form-control form-control-sm"
                   :placeholder="'URL ' + (i+1)" v-model="urls[i]" />
            <button class="btn btn-outline-secondary btn-sm px-1" @click="clearUrl(i)">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </template>
      </div>

      <p class="form-label fw-semibold mb-1">サイズ（px）</p>
      <div class="d-flex align-items-center gap-1 mb-3">
        <input type="number" class="form-control form-control-sm" style="width:80px;"
               v-model.number="frameWidth" min="200" max="3000" />
        <span class="text-secondary">×</span>
        <input type="number" class="form-control form-control-sm" style="width:80px;"
               v-model.number="frameHeight" min="200" max="3000" />
        <span class="text-secondary small">px</span>
      </div>

      <p class="form-label fw-semibold mb-1">プリセット</p>
      <div class="d-flex flex-wrap gap-1 mb-3">
        <button v-for="p in presets" :key="'mp'+p.label"
                class="btn btn-sm btn-outline-secondary"
                :class="{ active: activePreset === p.label }"
                @click="applyPreset(p)">
          <i :class="p.icon"></i> {{ p.label }}
        </button>
      </div>

    </div>
  </div>

  <!-- ===== メインプレビューエリア ===== -->
  <div id="main-area">
    <!-- 水平スクロール可能なiframeコンテナ -->
    <div id="preview-scroll">
      <div id="preview-container" ref="previewContainer">
        <template v-for="(src, i) in activeSrcs" :key="'f'+i">
          <div class="preview-slot">
            <div class="slot-label" :title="src || '(空)'">
              <span class="badge bg-secondary me-1">{{ i+1 }}</span>{{ src || '(URL未設定)' }}
            </div>
            <iframe v-if="src"
                    :src="src"
                    :width="frameWidth"
                    :height="frameHeight"
                    frameborder="0"
                    loading="lazy"
                    sandbox="allow-same-origin allow-scripts allow-forms allow-popups"
            ></iframe>
            <div v-else
                 class="iframe-placeholder"
                 :style="{ width: frameWidth + 'px', height: frameHeight + 'px' }">
              <div class="text-center">
                <i class="bi bi-window-dash fs-3 d-block mb-1"></i>
                URL未設定
              </div>
            </div>
          </div>
          <!-- リサイズハンドル（最後以外） -->
          <div v-if="i < activeSrcs.length - 1"
               id="resize-handle"
               @mousedown="startResizeW"
               :class="{ dragging: isDraggingW }"></div>
        </template>
      </div>
    </div>

    <!-- 高さリサイズハンドル -->
    <div id="resize-handle-h"
         @mousedown="startResizeH"
         :class="{ dragging: isDraggingH }"></div>
  </div>

  <!-- ===== トースト ===== -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">{{ toastMsg }}</div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

</div><!-- /#app -->

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>

<script>
const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

createApp({
  setup() {
    // ===== State =====
    const urls = reactive(['', '', '', '', '', '']);
    const activeSrcs = reactive(['', '', '', '', '', '']);
    const frameWidth  = ref(1280);
    const frameHeight = ref(720);
    const isDraggingW = ref(false);
    const isDraggingH = ref(false);
    const activePreset = ref('PC');
    const toastMsg = ref('');
    const previewContainer = ref(null);

    // ===== Presets =====
    const presets = [
      { label: 'ワイドPC',      w: 1920, icon: 'bi bi-display' },
      { label: 'PC',            w: 1280, icon: 'bi bi-pc-display' },
      { label: 'ラップトップ',  w: 1024, icon: 'bi bi-laptop' },
      { label: 'タブレット',    w: 768,  icon: 'bi bi-tablet' },
      { label: 'モバイル',      w: 390,  icon: 'bi bi-phone' },
      { label: 'スモール',      w: 320,  icon: 'bi bi-phone-flip' },
    ];

    // ===== URLからGETパラメータを読む =====
    function loadFromParams() {
      const sp = new URLSearchParams(location.search);
      for (let i = 0; i < 6; i++) {
        const v = sp.get('u' + (i + 1));
        if (v) { urls[i] = v; activeSrcs[i] = v; }
      }
      const w = parseInt(sp.get('w'));
      const h = parseInt(sp.get('h'));
      if (w > 0) frameWidth.value  = w;
      if (h > 0) frameHeight.value = h;
    }

    // ===== 表示適用 =====
    function applyUrls() {
      for (let i = 0; i < 6; i++) {
        activeSrcs[i] = urls[i].trim();
      }
    }

    function clearUrl(i) {
      urls[i] = '';
      activeSrcs[i] = '';
    }

    // ===== プリセット適用 =====
    function applyPreset(p) {
      frameWidth.value = p.w;
      activePreset.value = p.label;
    }

    // ===== シェアURL生成 & コピー =====
    function copyShareUrl() {
      const sp = new URLSearchParams();
      urls.forEach((u, i) => { if (u.trim()) sp.set('u' + (i + 1), u.trim()); });
      sp.set('w', frameWidth.value);
      sp.set('h', frameHeight.value);
      const shareUrl = location.origin + location.pathname + '?' + sp.toString();
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('URLをコピーしました！');
      }).catch(() => {
        // フォールバック
        const ta = document.createElement('textarea');
        ta.value = shareUrl;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('URLをコピーしました！');
      });
    }

    // ===== トースト =====
    let toastInstance = null;
    function showToast(msg) {
      toastMsg.value = msg;
      if (!toastInstance) {
        toastInstance = new bootstrap.Toast(document.getElementById('mainToast'), { delay: 2500 });
      }
      toastInstance.show();
    }

    // ===== リサイズ（幅） =====
    let startX = 0, startW = 0;
    function startResizeW(e) {
      isDraggingW.value = true;
      startX = e.clientX;
      startW = frameWidth.value;
      document.addEventListener('mousemove', onResizeW);
      document.addEventListener('mouseup', stopResizeW);
      e.preventDefault();
    }
    function onResizeW(e) {
      frameWidth.value = Math.max(200, startW + (e.clientX - startX));
    }
    function stopResizeW() {
      isDraggingW.value = false;
      document.removeEventListener('mousemove', onResizeW);
      document.removeEventListener('mouseup', stopResizeW);
    }

    // ===== リサイズ（高さ） =====
    let startY = 0, startH = 0;
    function startResizeH(e) {
      isDraggingH.value = true;
      startY = e.clientY;
      startH = frameHeight.value;
      document.addEventListener('mousemove', onResizeH);
      document.addEventListener('mouseup', stopResizeH);
      e.preventDefault();
    }
    function onResizeH(e) {
      frameHeight.value = Math.max(200, startH + (e.clientY - startY));
    }
    function stopResizeH() {
      isDraggingH.value = false;
      document.removeEventListener('mousemove', onResizeH);
      document.removeEventListener('mouseup', stopResizeH);
    }

    // ===== Mounted =====
    onMounted(() => {
      loadFromParams();
    });

    return {
      urls, activeSrcs, frameWidth, frameHeight,
      isDraggingW, isDraggingH, activePreset,
      presets, previewContainer, toastMsg,
      applyUrls, clearUrl, applyPreset, copyShareUrl,
      startResizeW, startResizeH,
    };
  }
}).mount('#app');
</script>
</body>
</html>
